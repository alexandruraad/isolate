//
// events.proto — IsolateEvent schema (shared between all services)
//
// All timestamps are nanoseconds since UNIX epoch unless noted.

syntax = "proto3";
package isolate.events.v1;

option java_package = "io.isolate.events.v1";
option go_package = "github.com/isolate-project/isolate/gen/go/events/v1;eventsv1";

// ── Primitive types ───────────────────────────────────────────────────────────

/// A single event emitted by an isobox.
message IsolateEvent {
    uint64  seq         = 1;  // monotonic sequence number per isobox
    uint64  timestamp   = 2;  // nanoseconds since UNIX epoch
    string  isobox_id   = 3;
    string  backend     = 4;  // e.g. "ebpf", "esf", "etw"
    oneof body {
        SyscallEvent  syscall  = 10;
        NetworkEvent  network  = 11;
        FileEvent     file     = 12;
        ProcessEvent  process  = 13;
        ExecEvent     exec     = 14;
        AlertEvent    alert    = 15;
    }
}

/// A syscall invocation.
message SyscallEvent {
    uint32  pid        = 1;
    uint32  tid        = 2;
    uint32  uid        = 3;
    uint32  gid        = 4;
    uint32  syscall_nr = 5;
    string  syscall_name = 6;  // resolved in userspace
    repeated uint64 args = 7;
    sint64  ret        = 8;
    bool    blocked    = 9;
    string  comm       = 10;
    uint64  cgroup_id  = 11;
}

/// A network packet or connection event.
message NetworkEvent {
    uint32  pid       = 1;
    uint32  uid       = 2;
    uint32  direction = 3;  // 0=egress, 1=ingress
    uint32  protocol  = 4;  // IPPROTO_TCP=6, IPPROTO_UDP=17
    uint32  verdict   = 5;  // 0=allow, 1=block
    string  src_addr  = 6;  // IPv4 or IPv6 string
    string  dst_addr  = 7;
    uint32  src_port  = 8;
    uint32  dst_port  = 9;
    uint32  length    = 10;
    uint64  cgroup_id = 11;
    string  comm      = 12;
}

/// A file access event.
message FileEvent {
    uint32  pid       = 1;
    uint32  uid       = 2;
    uint32  op        = 3;  // 0=open 1=create 2=rename 3=delete 4=exec
    bool    blocked   = 4;
    uint32  flags     = 5;
    uint32  mode      = 6;
    uint64  cgroup_id = 7;
    string  comm      = 8;
    string  path      = 9;
}

/// A process lifecycle event.
message ProcessEvent {
    uint32  pid       = 1;
    uint32  tid       = 2;
    uint32  ppid      = 3;
    uint32  uid       = 4;
    uint32  op        = 5;  // 0=exec 1=fork 2=exit
    sint32  exit_code = 6;
    uint64  cgroup_id = 7;
    string  comm      = 8;
    string  filename  = 9;  // for op=exec
}

/// An exec event with optional SHA256 of the binary.
message ExecEvent {
    uint32  pid       = 1;
    uint32  ppid      = 2;
    uint32  uid       = 3;
    string  comm      = 4;
    string  path      = 5;
    repeated string argv = 6;
    string  sha256    = 7;  // computed in userspace
    uint64  cgroup_id = 8;
}

/// An alert generated by the intelligence engine.
message AlertEvent {
    string  id           = 1;
    uint32  severity     = 2;  // 0=info 1=warn 2=critical 3=emergency
    string  title        = 3;
    string  detail       = 4;
    float   anomaly_score = 5;
    string  action_taken = 6;
    uint32  paladin_level = 7;
}
