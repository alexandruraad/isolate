[package]
name        = "isolate-paladin"
description = "Last-resort guardian: independent watchdog, escalating response, dead-man's switch"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[[bin]]
name = "isolate-paladin"
path = "src/main.rs"

[dependencies]
isolate-core   = { workspace = true }
isolate-events = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
chrono         = { workspace = true }
nix            = { workspace = true }
libc           = { workspace = true }
anyhow         = { workspace = true }
reqwest        = { workspace = true }

# Linux-specific for direct kernel operations bypassing isolatd
[target.'cfg(target_os = "linux")'.dependencies]
nix            = { workspace = true }
