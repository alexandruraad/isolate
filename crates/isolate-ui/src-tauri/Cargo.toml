[workspace]
# ↑ This opts the src-tauri crate out of the parent Cargo workspace.
# Standard Tauri pattern for monorepos — each Tauri app is its own workspace.

[package]
name        = "isolate-ui"
description = "Tauri desktop GUI for isolate — React/TypeScript frontend + Rust backend"
version     = "0.1.0"
edition     = "2021"
authors     = ["isolate contributors"]
license     = "Apache-2.0"

[[bin]]
name = "isolate-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
# Tauri v1 core — only actual feature flags (not JS API methods)
tauri = { version = "1", features = [ "window-set-title", "window-show", "window-hide",
    "shell-open",
    "window-close",
    "window-minimize",
    "window-maximize",
    "system-tray",
    "notification-all",
] }

# Isolate crates (path relative to this src-tauri/ directory)
# ../../isolate-core  →  crates/isolate-core
isolate-core   = { path = "../../isolate-core" }
isolate-events = { path = "../../isolate-events" }

# HTTP client for isolatd REST API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# WebSocket relay (live event stream from isolatd :7779)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util      = "0.3"

# Async runtime + serialisation
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow             = "1"
